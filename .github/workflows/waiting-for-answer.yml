name: Waiting for answer.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  waiting-for-answer:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: lee-dohm/no-response@v0.5.0
        with:
          token: ${{ github.token }}
          responseRequiredLabel: waiting for answer
